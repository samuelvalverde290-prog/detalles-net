<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel Admin | Detalles Nat</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-slate-100 text-slate-800 antialiased min-h-screen flex flex-col">

  <!-- PANTALLA DE LOGIN (Oculta por defecto si ya inició sesión) -->
  <div id="login-screen" class="fixed inset-0 z-50 bg-slate-900 flex items-center justify-center p-4">
    <div class="bg-white w-full max-w-md rounded-3xl p-8 shadow-2xl">
      <div class="text-center mb-6">
        <div class="w-16 h-16 bg-rose-100 text-rose-600 rounded-2xl flex items-center justify-center mx-auto text-2xl font-bold mb-3">
          <i class="fa-solid fa-lock"></i>
        </div>
        <h2 class="text-2xl font-black text-slate-900">Acceso Admin</h2>
        <p class="text-xs text-slate-500 mt-1">Detalles Nat - Panel Privado</p>
      </div>

      <form id="login-form" class="space-y-4">
        <div>
          <label class="block text-xs font-bold uppercase text-slate-500 mb-1">Usuario:</label>
          <input type="text" id="admin-user" required placeholder="Tu usuario" class="w-full p-3.5 border border-slate-200 rounded-2xl text-sm font-semibold focus:ring-2 focus:ring-rose-400 focus:outline-none">
        </div>
        <div>
          <label class="block text-xs font-bold uppercase text-slate-500 mb-1">Contraseña:</label>
          <input type="password" id="admin-pass" required placeholder="••••••••" class="w-full p-3.5 border border-slate-200 rounded-2xl text-sm font-semibold focus:ring-2 focus:ring-rose-400 focus:outline-none">
        </div>
        <p id="login-error" class="text-xs text-rose-600 font-bold text-center hidden">Usuario o contraseña incorrectos.</p>
        <button type="submit" class="w-full py-4 bg-rose-500 hover:bg-rose-600 text-white font-bold rounded-2xl shadow-lg shadow-rose-200 transition-all text-base mt-2">
          Ingresar al Panel
        </button>
      </form>
      <div class="text-center mt-6">
        <a href="index.html" class="text-xs font-bold text-slate-400 hover:text-slate-600">← Volver a la tienda principal</a>
      </div>
    </div>
  </div>

  <!-- CONTENIDO PRINCIPAL DEL ADMIN (Bloqueado hasta iniciar sesión) -->
  <div id="admin-main-content" class="flex flex-col min-h-screen hidden">
    <header class="bg-slate-900 text-white py-4 px-6 flex items-center justify-between shadow-md">
      <div class="flex items-center gap-3">
        <i class="fa-solid fa-sliders text-rose-400 text-xl"></i>
        <h1 class="font-bold text-lg">Panel de Administración - Detalles Nat</h1>
      </div>
      <div class="flex items-center gap-3">
        <button id="admin-logout-btn" class="text-xs bg-slate-800 hover:bg-slate-700 px-3.5 py-2 rounded-xl transition-colors">
          <i class="fa-solid fa-right-from-bracket mr-1"></i> Salir
        </button>
        <a href="index.html" class="text-xs bg-slate-800 hover:bg-slate-700 px-3.5 py-2 rounded-xl transition-colors">
          <i class="fa-solid fa-arrow-left mr-1"></i> Tienda
        </a>
      </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-8 w-full flex-1 space-y-8">
      
      <!-- Configuración de Pagos y Cuentas -->
      <div class="bg-white p-6 rounded-3xl shadow-sm border border-slate-200">
        <h2 class="text-xl font-extrabold text-slate-900 mb-4 flex items-center gap-2">
          <i class="fa-solid fa-wallet text-rose-500"></i> Configuración de Cuentas BCP / Yape / WhatsApp
        </h2>
        <form id="settings-form" class="grid grid-cols-1 md:grid-cols-4 gap-4">
          <div>
            <label class="block text-xs font-bold uppercase text-slate-500 mb-1">WhatsApp Recepción:</label>
            <input type="text" id="set-whatsapp" placeholder="51999999999" class="w-full p-3 border border-slate-200 rounded-2xl text-sm font-semibold">
          </div>
          <div>
            <label class="block text-xs font-bold uppercase text-slate-500 mb-1">Número Yape / Plin:</label>
            <input type="text" id="set-yape-phone" placeholder="999 999 999" class="w-full p-3 border border-slate-200 rounded-2xl text-sm font-semibold">
          </div>
          <div>
            <label class="block text-xs font-bold uppercase text-slate-500 mb-1">Cuenta BCP:</label>
            <input type="text" id="set-bcp" placeholder="193-..." class="w-full p-3 border border-slate-200 rounded-2xl text-sm font-semibold">
          </div>
          <div>
            <label class="block text-xs font-bold uppercase text-slate-500 mb-1">Archivo / URL de Imagen QR:</label>
            <input type="text" id="set-qr" placeholder="qr_yape.png" class="w-full p-3 border border-slate-200 rounded-2xl text-sm font-semibold">
          </div>
          <div class="md:col-span-4 flex justify-end">
            <button type="submit" class="px-6 py-3 bg-rose-500 hover:bg-rose-600 text-white font-bold rounded-2xl text-sm transition-colors shadow-md">
              Guardar Cambios de Cuenta
            </button>
          </div>
        </form>
      </div>

      <!-- Gestión de Catálogo -->
      <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
        
        <!-- Formulario -->
        <div class="bg-white p-6 rounded-3xl shadow-sm border border-slate-200 h-fit">
          <h2 id="form-title" class="text-xl font-extrabold text-slate-900 mb-4">Agregar Nuevo Producto</h2>
          
          <form id="admin-product-form" class="space-y-4">
            <input type="hidden" id="admin-product-id">
            
            <div>
              <label class="block text-xs font-bold uppercase text-slate-500 mb-1">Nombre del Ramo / Detalle:</label>
              <input type="text" id="admin-product-name" required placeholder="Ej. Ramo Hot Wheels 6 Carritos" class="w-full p-3 border border-slate-200 rounded-2xl text-sm font-semibold">
            </div>

            <div>
              <label class="block text-xs font-bold uppercase text-slate-500 mb-1">Categoría:</label>
              <select id="admin-product-category" required class="w-full p-3 border border-slate-200 rounded-2xl text-sm font-semibold">
                <option value="Ramos Hot Wheels">Ramos Hot Wheels</option>
                <option value="Ramos Hello Kitty">Ramos Hello Kitty</option>
                <option value="Ramos de Chocolates">Ramos de Chocolates</option>
                <option value="Flores Amarillas">Flores Amarillas</option>
                <option value="14 de Febrero">14 de Febrero</option>
              </select>
            </div>

            <div>
              <label class="block text-xs font-bold uppercase text-slate-500 mb-1">Precio (S/):</label>
              <input type="number" step="0.10" id="admin-product-price" required placeholder="89.90" class="w-full p-3 border border-slate-200 rounded-2xl text-sm font-semibold">
            </div>

            <div>
              <label class="block text-xs font-bold uppercase text-slate-500 mb-1">URL o Nombre de la Imagen:</label>
              <input type="text" id="admin-product-image" required placeholder="https://... o imagen.jpg" class="w-full p-3 border border-slate-200 rounded-2xl text-sm font-semibold">
            </div>

            <div>
              <label class="block text-xs font-bold uppercase text-slate-500 mb-1">Descripción:</label>
              <textarea id="admin-product-desc" rows="3" required placeholder="Contenido exacto del ramo..." class="w-full p-3 border border-slate-200 rounded-2xl text-sm font-semibold"></textarea>
            </div>

            <div class="flex gap-2 pt-2">
              <button type="submit" class="flex-1 py-3 bg-rose-500 hover:bg-rose-600 text-white font-bold rounded-2xl transition-colors shadow-md text-sm">
                Guardar Producto
              </button>
              <button type="button" id="admin-cancel-btn" class="hidden px-4 py-3 bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold rounded-2xl transition-colors text-sm">
                Cancelar
              </button>
            </div>
          </form>
        </div>

        <!-- Tabla -->
        <div class="lg:col-span-2 bg-white p-6 rounded-3xl shadow-sm border border-slate-200">
          <div class="flex items-center justify-between mb-4">
            <h2 class="text-xl font-extrabold text-slate-900">Productos Registrados</h2>
            <button id="reset-default-btn" class="text-xs text-rose-500 hover:underline font-bold">Restablecer por defecto</button>
          </div>

          <div class="overflow-x-auto">
            <table class="w-full text-left text-sm text-slate-600">
              <thead class="bg-slate-50 text-slate-700 uppercase text-xs font-bold border-b border-slate-200">
                <tr>
                  <th class="p-3">Imagen</th>
                  <th class="p-3">Nombre</th>
                  <th class="p-3">Categoría</th>
                  <th class="p-3">Precio</th>
                  <th class="p-3 text-right">Acciones</th>
                </tr>
              </thead>
              <tbody id="admin-products-table">
                <!-- Dinámico -->
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="admin.js"></script>
</body>
</html>
